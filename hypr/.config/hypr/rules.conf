# New Window Rule Syntax (Block style)
windowrule {
    name = floating_tui
    match:class = ^(floating_tui)$
    float = on
    center = on
    size = 900 700
    stay_focused = on
}

windowrule {
    name = copyQ
    match:class = ^(com.github.hluk.copyq)$
    float = on
    center = on
    size = 800 500
    stay_focused = on
}

windowrule {
    name = ff_rule
    match:class = ^(firefox)$
    opacity = 1.0 override
}

# Global Rules using new match: syntax
windowrule = suppress_event maximize, match:class .*
# windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Decoration overrides
decoration {
    rounding = 10 
    active_opacity = 0.9
    inactive_opacity = 0.9
    
    blur {
        enabled = true
        size = 5 
        passes = 1 
    }
}
