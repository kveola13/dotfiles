general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep.
}

# 1. Dim Screen
listener {
    timeout = 150                                
    # FIX: Use the command directly, not through hyprctl dispatch
    on-timeout = brightnessctl set 10%           
    on-resume = brightnessctl set 100%           
}

# 2. Lock Screen
listener {
    timeout = 300                                
    on-timeout = loginctl lock-session           
}

# 3. Turn off monitor
listener {
    timeout = 330                                
    # FIX: hyprctl dispatch dpms is correct here as it is an internal Hyprland command
    on-timeout = hyprctl dispatch dpms off       
    on-resume = hyprctl dispatch dpms on         
}
